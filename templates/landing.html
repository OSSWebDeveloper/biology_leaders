{% extends "base.html" %}
{% comment %}Oddiy brauzerda (Telegram'siz) faqat «Telegram orqali kiring»: sayt nomi ham, bot ham ko'rsatilmaydi.{% endcomment %}
{% block title %}{% endblock %}
{% block body %}
<div class="center-screen"><div id="box">
  <div class="spinner" id="spin" style="display:none"></div>
  <h1 id="ttl"></h1>
  <p class="muted" id="txt">Telegram orqali kiring.</p>
</div></div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg || !tg.initData) return;
  const spin = document.getElementById('spin'), txt = document.getElementById('txt');
  const stop = message => { spin.style.display = 'none'; if (message) txt.textContent = message; };
  document.title = document.getElementById('ttl').textContent = 'Milliy Sertifikat';
  txt.textContent = 'Kirilmoqda…';
  spin.style.display = '';
  fetch("{% url 'tg_auth' %}", {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
    body: JSON.stringify({init_data: tg.initData}),
  }).then(r => r.json().catch(() => ({})).then(d => ({ok: r.ok, status: r.status, d}))).then(({ok, status, d}) => {
    if (ok) location.replace("{% if after_login %}{{ after_login|escapejs }}{% else %}{% url 'exam_list' %}{% endif %}");
    else stop(d.error || `Kirib bo'lmadi (xato ${status}). Qayta urinib ko'ring.`);
  }).catch(() => stop("Internet bilan aloqa yo'q. Qayta urinib ko'ring."));
})();
</script>
{% endblock %}
