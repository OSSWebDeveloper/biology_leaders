{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block body %}
<div class="center-screen"><div id="box" class="login-box">
  <div class="spinner" id="spin"></div>
  <h1 id="ttl">Milliy Sertifikat</h1>
  <form method="post" id="pwd" class="form" hidden>{% csrf_token %}
    <input type="password" name="password" placeholder="Parol" autocomplete="current-password" required autofocus>
    {% if error %}<p class="msg error mb0">{{ error }}</p>{% endif %}
    <button class="btn block">Kirish</button>
  </form>
  <p class="muted" id="txt"></p>
</div></div>
{% endblock %}
{% block scripts %}
<script>
(function () {
  const tg = window.Telegram && window.Telegram.WebApp;
  const spin = document.getElementById('spin'), txt = document.getElementById('txt');
  const stop = message => { spin.style.display = 'none'; txt.textContent = message || ''; };

  if (tg && tg.initData) {
    {% if browser_only %}
    document.getElementById('ttl').textContent = 'Sahifa topilmadi';
    stop('');
    {% else %}
    txt.textContent = 'Kirilmoqda…';
    fetch("{% url 'tg_auth' %}", {
      method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': csrfToken()},
      body: JSON.stringify({init_data: tg.initData}),
    }).then(r => r.json().catch(() => ({})).then(d => ({ok: r.ok, status: r.status, d}))).then(({ok, status, d}) => {
      if (ok) location.replace(location.pathname);
      else stop(d.error || `Kirib bo'lmadi (xato ${status}). Qayta urinib ko'ring.`);
    }).catch(() => stop("Internet bilan aloqa yo'q. Qayta urinib ko'ring."));
    {% endif %}
    return;
  }

  // Kompyuter brauzeri: parol
  spin.style.display = 'none';
  document.getElementById('pwd').hidden = false;
})();
</script>
{% endblock %}
