{% extends "base.html" %}
{% block title %}Testga kirish{% endblock %}
{% block content %}
<h1>Testga kirish</h1>
<form method="post" class="card form">{% csrf_token %}
  <label for="code">Kirish kodi</label>
  <input id="code" name="code" maxlength="8" required placeholder="Masalan: BIO15" autocapitalize="characters" autocomplete="off" spellcheck="false">
  <p class="muted small">Kod guruhga yuborilgan xabarda yozilgan.</p>
  <button class="btn block">Kirish</button>
</form>
{% for a in active %}
<a class="card link" href="{% url 'attempt' a.pk %}">
  <div class="title">{{ a.exam.title }}</div>
  <span class="tag warn mt">Davom ettirish</span>
</a>
{% endfor %}
{% endblock %}
